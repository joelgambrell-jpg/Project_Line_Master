name: NEXUS One-Line Preview

on:
  push:
    branches:
      - feature/layered-operations-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
      - name: Verify JavaScript syntax
        run: |
          for file in ./*.js; do node --check "$file"; done
          node --check tests/equipment-details.cjs
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/nexus-test" playwright
          "$RUNNER_TEMP/nexus-test/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify equipment inspector in iPad viewport
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/nexus-test/node_modules/playwright
        run: node tests/equipment-details.cjs
      - name: Build static preview artifact
        run: |
          mkdir -p preview
          cp -R ./*.html ./*.js ./*.css ./*.png preview/ 2>/dev/null || true
          cat > preview/PREVIEW_BUILD.txt <<EOF
          NEXUS One-Line development preview
          Branch: feature/layered-operations-ui
          Commit: $GITHUB_SHA
          Built: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-one-line-preview
          path: preview
          retention-days: 30
